services:
  password-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: password-generator:latest
    container_name: password-generator
    ports:
      - target: 80
        published: 8080
        protocol: tcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
